services:
  db:
    image: postgres:16-alpine
    container_name: cable_payment_db
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: cable_payment_backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Overrides backend/.env's localhost-based DATABASE_URL: inside the Docker network the
      # database is reachable at the "db" service name, not localhost.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Public URL customers' SMS/WhatsApp payment links point to -- must match the port
      # the frontend/nginx service is published on below.
      FRONTEND_BASE_URL: ${DEPLOYED_BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: cable_payment_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
